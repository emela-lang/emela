# release-plz configuration. See docs/release.md for the end-to-end flow.
#
# The workspace ships as a single product: the `emela` binary. Every crate
# shares one inherited version (`version.workspace = true` in Cargo.toml), so a
# release bumps them together and cuts a single `vX.Y.Z` tag. That tag is what
# `release.yml` waits for to build and publish the tarball GitHub Release — so
# release-plz only bumps the version, appends to the changelog, and pushes the
# tag. It never publishes to crates.io nor creates the GitHub Release itself.

[workspace]
# Nothing lands on crates.io (`publish = false` below). Without this, release-plz
# reads the "last released version" from the registry, finds nothing, treats each
# crate as a first release, and never bumps. `git_only` makes it derive versions
# from the git tags instead, which is what we actually release on.
#
# Do not set `publish = false` in Cargo.toml: release-plz skips unpublishable
# packages entirely, so `emela-cli` would never be tagged. git_only also runs
# `cargo package` on the tagged commit, so the internal workspace dependencies
# carry a `version`, and a dev-dependency that would form a cycle (emela-types ->
# emela-core) stays path-only.
git_only = true
# In the 0.y.z range a `feat:` commit should bump the minor (0.2.1 -> 0.3.0).
# release-plz's default for 0.x bumps the patch; flip it to match our convention.
features_always_increment_minor = true
# Distribution is the `emela` binary tarball, not crates.io packages.
publish = false
# `release.yml` creates the GitHub Release (with tarballs) when the tag lands.
git_release_enable = false
# Only the `emela` package is tagged (see [[package]] below). Suppressing the
# default per-crate tags (`emela-codegen-v…`, `emela-backend-js-v…`, …) keeps
# exactly one `vX.Y.Z` tag per release, which is what `release.yml` triggers on.
git_tag_enable = false
# In git-only mode this pattern is also how every crate finds its last release.
# With the default `{{ package }}-v{{ version }}` the library crates look for
# tags that never exist (`emela-lsp-v0.20.0`, …), count as initial releases and
# keep their current version. Pointing all of them at the shared `vX.Y.Z` tag
# that emela-cli cuts gives each crate the right previous release.
git_tag_name = "v{{ version }}"
# Keep a single changelog at the repo root instead of one per library crate.
changelog_update = false

# Every crate shares one version (`version.workspace = true`). release-plz only
# sees a change in a crate whose directory a commit touched, so a commit that
# only touches emela-lsp would bump nothing for emela-cli, which owns the tag and
# the changelog. One `version_group` makes a change in any crate bump all of them
# to the same next version.
[[package]]
name = "emela-syntax"
version_group = "emela"

[[package]]
name = "emela-resolve"
version_group = "emela"

[[package]]
name = "emela-types"
version_group = "emela"

[[package]]
name = "emela-core"
version_group = "emela"

[[package]]
name = "emela-lir"
version_group = "emela"
# A crate added after the last release does not exist at that release's `vX.Y.Z`
# tag, and in git-only mode release-plz fails looking for it there ("Failed to find
# package"). A tag name that never exists makes it a first release instead; the
# version group still moves it with the rest. Remove this once a release tag
# contains emela-lir. Do the same for any new crate.
git_tag_name = "emela-lir-v{{ version }}"

[[package]]
name = "emela-codegen-js"
version_group = "emela"

[[package]]
name = "emela-codegen-wasm"
version_group = "emela"

[[package]]
name = "emela-codegen-c"
version_group = "emela"
# Added after the last release; see emela-lir above.
git_tag_name = "emela-codegen-c-v{{ version }}"

[[package]]
name = "emela-fmt"
version_group = "emela"

[[package]]
name = "emela-driver"
version_group = "emela"

[[package]]
name = "emela-lsp"
version_group = "emela"

[[package]]
name = "emela-cli"
version_group = "emela"
# The binary crate (it builds the `emela` binary) cuts the one release tag `release.yml` listens for.
git_tag_enable = true
# Maintain the existing root CHANGELOG.md (relative to the workspace Cargo.toml).
git_release_enable = true
git_release_draft = true
changelog_update = true
changelog_path = "CHANGELOG.md"
# The version group decides the version, not the changelog: emela-cli's
# changelog lists only commits that touched crates/emela-cli. Pull in every other
# crate's commits so the one root changelog covers the whole release.
changelog_include = [
  "emela-syntax",
  "emela-resolve",
  "emela-types",
  "emela-core",
  "emela-lir",
  "emela-codegen-js",
  "emela-codegen-wasm",
  "emela-codegen-c",
  "emela-fmt",
  "emela-driver",
  "emela-lsp",
]

