# Emela 0.20 系（言語仕様 草案 2026-10-07）．0.10 系のコンパイラは `legacy` ブランチにある．
#
# 依存は一方向:
#
#   syntax → resolve → types → core → codegen-js / codegen-wasm
#      ↓                                      ↓
#     fmt                                  driver → lsp → cli

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.20.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# 無損失構文木（rust-analyzer と同じ green/red tree）．空白とコメントも木に残るので，
# fmt と LSP が同じ木を使える．
rowan = "0.16"
# 字句解析器の生成．改行の継続判定（2.5）はトークン列を受けた後段で行う．
logos = "0.16"
# 型推論の単一化（rustc 由来の union-find）．
ena = "0.14"
# 添字で引くアリーナ．名前解決と型付けの結果を ID で持ち回る．
la-arena = "0.3"
# O(1) clone の短い文字列．識別子とモジュール名に使う．
smol_str = "0.3"
rustc-hash = "2"
indexmap = "2"
# Wadler 式の整形コンビネータ（fmt）．
pretty = "0.12"
# WASM バイナリの直接出力．検査は wasmparser で行う．
wasm-encoder = "0.261"
wasmparser = "0.261"
# オフセット ↔ 行・列の変換（CLI 表示と LSP の位置で共有）．
line-index = "0.1"
# 端末向けの診断表示．
ariadne = "0.6"
# emela.toml の読み込み．
serde = { version = "1", features = ["derive"] }
toml = "1"
# 言語サーバー（rust-analyzer と同じ同期型の骨組み．tokio を持ち込まない）．
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# スナップショットテスト（構文木・型・出力コードの比較）．
insta = { version = "1", features = ["glob"] }
# 性質テスト（字句解析の無損失性などを任意の入力で検査する）．
proptest = "1"

emela-syntax = { path = "crates/emela-syntax" }
emela-fmt = { path = "crates/emela-fmt" }
emela-resolve = { path = "crates/emela-resolve" }
emela-types = { path = "crates/emela-types" }
emela-core = { path = "crates/emela-core" }
emela-codegen-js = { path = "crates/emela-codegen-js" }
emela-codegen-wasm = { path = "crates/emela-codegen-wasm" }
emela-driver = { path = "crates/emela-driver" }
emela-lsp = { path = "crates/emela-lsp" }

[profile.dev.package.insta]
opt-level = 3
