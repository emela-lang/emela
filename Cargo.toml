# Emela 0.20 系（言語仕様 草案 2026-10-07）．0.10 系のコンパイラは `legacy` ブランチにある．
#
# 依存は一方向:
#
#   syntax → resolve → types → core ──────→ codegen-js ───┐
#      ↓                         └─→ lir ─┬→ codegen-c ───┤
#     fmt                                 └→ codegen-wasm ┤
#                                                         ↓
#                                           driver → lsp → cli
#
# pome（Pome.toml，Pome.lock，MVS，sumdb の検証）はほかの crate に依存しない．
#
# lir（低い IR）は codegen-c が使い，codegen-wasm も使う予定．

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.25.0"
license = "Apache-2.0"

[workspace.dependencies]
# 無損失構文木（rust-analyzer と同じ green/red tree）．空白とコメントも木に残るので，
# fmt と LSP が同じ木を使える．
rowan = "0.17"
# 字句解析器の生成．改行の継続判定（2.5）はトークン列を受けた後段で行う．
logos = "0.16"
# 型推論の単一化（rustc 由来の union-find）．
ena = "0.14"
# 添字で引くアリーナ．名前解決と型付けの結果を ID で持ち回る．
la-arena = "0.3"
# O(1) clone の短い文字列．識別子とモジュール名に使う．
smol_str = "0.3"
rustc-hash = "2"
indexmap = "2"
# Wadler 式の整形コンビネータ（fmt）．
pretty = "0.12"
# WASM バイナリの直接出力．検査は wasmparser で行う．
wasm-encoder = "0.261"
wasmparser = "0.261"
# WASI 0.3 の component 化: WIT の解決と core module の wrapping．
wit-parser = "0.261"
wit-component = "0.261"
# オフセット ↔ 行・列の変換（CLI 表示と LSP の位置で共有）．
line-index = "0.1"
# 端末向けの診断表示．
ariadne = "0.6"
# emela.toml の読み込み．
serde = { version = "1", features = ["derive"] }
toml = "1"
# emela pome が Pome.toml を書き換える（コメントと並びを残す）．
toml_edit = "0.25"
# 言語サーバー（rust-analyzer と同じ同期型の骨組み．tokio を持ち込まない）．
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# emela doc の `##`（Markdown）を HTML にする．コマンドラインの部分（getopts）は要らない．
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# スナップショットテスト（構文木・型・出力コードの比較）．
insta = { version = "1", features = ["glob"] }
# 性質テスト（字句解析の無損失性などを任意の入力で検査する）．
proptest = "1"
# Pome（4.7）: 中身のハッシュ h1，sumdb の checkpoint の署名の検証．
sha2 = "0.10"
base64 = "0.23"
ed25519-dalek = "2"
# Pome の取得: proxy と sumdb への HTTP（rustls．tokio を持ち込まない同期型），アーカイブ（.tar.gz）の展開．
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"

# The version lets `cargo package` (run by release-plz in git_only mode) verify
# each crate; release-plz bumps it together with the workspace version.
emela-syntax = { path = "crates/emela-syntax", version = "0.25.0" }
emela-fmt = { path = "crates/emela-fmt", version = "0.25.0" }
emela-resolve = { path = "crates/emela-resolve", version = "0.25.0" }
emela-types = { path = "crates/emela-types", version = "0.25.0" }
emela-core = { path = "crates/emela-core", version = "0.25.0" }
emela-lir = { path = "crates/emela-lir", version = "0.25.0" }
emela-codegen-js = { path = "crates/emela-codegen-js", version = "0.25.0" }
emela-codegen-wasm = { path = "crates/emela-codegen-wasm", version = "0.25.0" }
emela-codegen-c = { path = "crates/emela-codegen-c", version = "0.25.0" }
emela-codegen-emb = { path = "crates/emela-codegen-emb", version = "0.25.0" }
emela-driver = { path = "crates/emela-driver", version = "0.25.0" }
emela-lsp = { path = "crates/emela-lsp", version = "0.25.0" }
emela-pome = { path = "crates/emela-pome", version = "0.25.0" }

[profile.dev.package.insta]
opt-level = 3

# sumdb の証明のテストは何万回も sha256 を計算する．
[profile.dev.package.sha2]
opt-level = 3

# 構文木をたどる処理の大半は rowan の中で動く（fmt の性質テストは命令数が半分になる）．
[profile.dev.package.rowan]
opt-level = 3
