name = "Emela"
grammar = "emela"
path_suffixes = ["emel"]
line_comments = ["## ", "# "]
# `emela fmt` indents by two spaces and never uses tabs.
tab_size = 2
hard_tabs = false
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["_"]
