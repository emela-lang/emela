# cargo-mutants (https://mutants.rs) configuration.
#
# Run it per crate: `cargo mutants -p <crate>`. A mutant that no test catches (MISSED) is either
# caught by a new or better test, or listed below with the reason no test can catch it: the
# mutated code behaves the same as the original on every input (an equivalent mutant), or it
# only guards against a bug in the code itself.

test_tool = "nextest"

# cargo-mutants 27.1 does not apply `exclude_re` to the mutants that delete a field from a struct
# expression; an equivalent one is avoided by writing the field as an assignment instead.

# emela-codegen-emb is to be removed (v0.28).
exclude_globs = ["crates/emela-codegen-emb/**"]

exclude_re = [
    # --- emela-syntax ---

    # `tokens[i]` is the NEWLINE being judged, which every one of these searches skips, so
    # starting at `i` (`i * 1`) or `i - 1` instead of `i + 1` finds the same token.
    'lexer/continuation\.rs:\d+:\d+: replace \+ with [*-] in (next_significant|postfix_match_follows|starts_clause)',

    # The parser's fuel only stops a parser that no longer advances, which is a bug in the
    # parser; a correct parser never runs out.
    'parser\.rs:\d+:\d+: replace - with [+/] in Parser<.t>::nth',

    # A PARAM with a name or `self` has no node before its `:`, so the search after the check
    # finds nothing either way.
    'ast\.rs:\d+:\d+: replace \|\| with && in Param::pattern',

    # The only LOWER_NAME token directly under IMPL_DECL is `for`, and the only one directly
    # under HANDLER_DECL is `implements`; other lower names land in ERROR nodes.
    'rewrite\.rs:\d+:\d+: replace && with \|\| in (old_impl_head|old_handler_head)',

    # The parameters of the old `fn(...)` form are names, never patterns, so the last child node
    # of a PARAM is its type whenever it has one.
    'rewrite\.rs:\d+:\d+: replace is_type -> bool with true',

    # --- emela-resolve ---

    # NoBuiltins has no modules, so nothing asks it for the names of one, and no module named
    # by an empty name can be written.
    'builtins\.rs:\d+:\d+: replace (BuiltinModules::names|<impl BuiltinModules for NoBuiltins>::modules) -> Vec<SmolStr> with vec!',

    # A node is pushed on the work list only before it is visited, so an edge index of 0 already
    # means an unvisited node.
    'graph\.rs:\d+:\d+: replace && with \|\| in tarjan',

    # A handler cannot be written as a type (E0302), so no fn's first parameter has a handler
    # type; the arm is kept for the rule of `[data.type]`, which counts handlers with fields.
    'lower\.rs:\d+:\d+: delete match arm Some\(Item::(Handler\(h\)|Ctor\(c\))\) in check_fn_field_names',

    # Only an INT or a FLOAT starts a LITERAL, and a STRING has only STRING_TEXT tokens and
    # INTERP nodes, so these guards are always true where they are reached.
    'lower\.rs:\d+:\d+: replace match guard t\.kind\(\) == FLOAT with true in Lower<.*>::expr',
    'lower\.rs:\d+:\d+: replace match guard n\.kind\(\) == INTERP with true in Lower<.*>::string',
    # The lexer never puts two STRING_TEXT tokens next to each other.
    'lower\.rs:\d+:\d+: delete match arm Some\(StrPart::Text\(prev\)\) in Lower<.*>::string',

    # A constructor that is not of a type or a handler is a variant of an enum.
    'lower\.rs:\d+:\d+: replace match guard self\.r\.program\.defs\[p\]\.kind == DefKind::Enum with true in Lower<.*>::update',

    # An operator token is always present, and `+` is also the fallback for a broken tree.
    'lower\.rs:\d+:\d+: delete match arm PLUS in Lower<.*>::binary',

    # The children of these lists are patterns or expressions (the syntax checks reject the
    # rest, E0125), so the kind checks only skip ERROR nodes of trees with syntax errors.
    'lower\.rs:\d+:\d+: replace match guard is_pat\(k\) with true in Lower<.*>::pat',
    'lower\.rs:\d+:\d+: replace is_pat -> bool with true',
    'lower\.rs:\d+:\d+: replace match guard is_expr\(k\) with true in Lower<.*>::expr_pat',
    # A NAME_REF starts with a lower name, an upper name or `self`, and the syntax checks reject
    # `self` and parentheses on the left of a binding (E0125).
    'lower\.rs:\d+:\d+: replace match guard t\.kind\(\) == UPPER_NAME with true in Lower<.*>::expr_pat',
    'lower\.rs:\d+:\d+: delete match arm PAREN_EXPR in Lower<.*>::expr_pat',

    # An annotation argument with a string is either a string alone or `name: "..."`, which has
    # both a lower name and a colon.
    'lower\.rs:\d+:\d+: replace \|\| with && in attrs',

    # A single-token argument of `@entry` without a node is a name: a type name is an ANNOT_PATH
    # and a literal is a node.
    'lower\.rs:\d+:\d+: replace match guard name\.kind\(\) == LOWER_NAME with true in Lower<.*>::entry_adapter',

    # Only constructors take their parent's visibility; nothing reads the visibility of other
    # children (operations, fields, type parameters).
    'resolve\.rs:\d+:\d+: replace match guard kind == DefKind::Ctor with true in Resolver<.*>::alloc_def',

    # A declaration other than an impl without a name has a syntax error and is skipped; an
    # impl's generated name (`impl#1`) cannot be written, so putting it in a namespace changes
    # no lookup.
    'resolve\.rs:\d+:\d+: replace match guard kind == DefKind::Impl with true in Resolver<.*>::collect',
    'resolve\.rs:\d+:\d+: delete match arm DefKind::Impl in Resolver<.*>::collect',

    # --- emela-types ---

    # Every module has a name, so the empty-name fallback is never taken.
    'export\.rs:\d+:\d+: replace match guard !items\.name\.segments\(\)\.is_empty\(\) with true in display_name',

    # A function type has no head, so it fails at the end too; `()` has no Prelude definition
    # either way.
    'traits\.rs:\d+:\d+: delete match arm Ty::Fn\(_\) in Traits::satisfies',
    'traits\.rs:\d+:\d+: delete match arm Ty::Prim\(Prim::Unit\) in head_def',
    # The only other Prelude trait, Immediate, cannot bound a type parameter of a type
    # (ImmediateOnNonEffect), so no type is checked against it here.
    'traits\.rs:212:\d+: replace && with \|\| in Traits::satisfies',
    # Name resolution makes a supertrait that is not a trait `Res::Err`.
    'traits\.rs:\d+:\d+: replace match guard program\.defs\[s\]\.kind == DefKind::Trait with true in collect',

    # A scope without set parameters (`sets: false`) has no parameters or only ordinary ones
    # (`TyTable::lower` marks them all `Type`), so a set parameter is never found there.
    'src/lower\.rs:\d+:\d+: replace match guard !scope\.sets with false in TyTable::lower_error_set',
    'src/lower\.rs:\d+:\d+: (delete match arm Some\(ParamKind::Set\)|replace match guard scope\.sets with true) in TyTable::lower_effect_set',
    'src/lower\.rs:\d+:\d+: replace (match guard scope\.kinds\.get\(i\) == Some\(&ParamKind::Set\)( && scope\.sets)? with (true|false)|&& with \|\||== with !=) in TyTable::set_elem',

    # An inclusion whose subset is empty, or equal to its superset, always holds.
    'infer\.rs:\d+:\d+: replace \|\| with && in InferCtx::add_subset_of',
    # Float patterns are literals, never NaN.
    'exhaustiveness\.rs:\d+:\d+: replace && with \|\| in <impl PartialEq for Lit>::eq',
    # The examples of what a match misses are cut to `limit` at the end, so asking for more on the
    # way changes nothing but the work done.
    'exhaustiveness\.rs:\d+:\d+: replace - with \+ in Cx<.*>::useful',
    'exhaustiveness\.rs:\d+:\d+: replace < with <= in Cx<.*>::useful',
    # Every module has a name.
    'fiber\.rs:\d+:\d+: replace match guard !items\.name\.segments\(\)\.is_empty\(\) with true in qualified_name',
    # Every trait, the Prelude's included (the bundled `prelude.emel`), has an item; the fallback
    # finds the same fns in the same order.
    'methods\.rs:\d+:\d+: (delete match arm Some\(Item::Trait\(item\)\)|replace (&& with \|\||== with !=)) in trait_fns',
    # `Row::empty` is the default row.
    'row\.rs:\d+:\d+: replace Row::empty -> Self with Default::default\(\)',
    # The name ena prints when debugging its tables.
    'ty\.rs:\d+:\d+: replace <impl UnifyKey for TyVar>::tag -> &.static str with',
    # A pattern whose shape does not fit its type is already a type error (E0301); how coverage
    # reads it then does not matter.
    'coverage\.rs:\d+:\d+: replace match guard (tys\.is_empty\(\)|elems\.len\(\) == tys\.len\(\)|item\.owner == ty_def) with (true|false) in',
    'coverage\.rs:\d+:\d+: replace == with != in <impl CtorTable for Shapes<.*>>::value_pat',
    # Name resolution reports a constructor that is not an error in an escape arm (E0217), and a
    # guarded `_` is broken whichever arm says so; with no caught tag, the set variable is
    # replaced by one that excludes nothing.
    'body/errors\.rs:\d+:\d+: replace match guard program\.defs\[\*def\]\.kind == DefKind::Error with true in BodyInfer<.*>::expr_row',
    'body/errors\.rs:\d+:\d+: delete match arm PatKind::Wild in BodyInfer<.*>::expr_row',
    'body/errors\.rs:\d+:\d+: replace match guard !tags\.is_empty\(\) with true in BodyInfer<.*>::expr_row',
    'body\.rs:\d+:\d+: (replace match guard program\.defs\[\*def\]\.kind == DefKind::Error with true|delete match arm PatKind::Ctor\{\.\.\} \| PatKind::Missing) in BodyInfer<.*>::infer_escape',
    # A user effect has no set type parameters (spec 8.1), so it has no own tag to add to the
    # uses of its operations' parameters.
    'signature\.rs:\d+:\d+: replace match guard is_intrinsic_effect\(program, e\) with true in op_signature',
    # A label defaulted by two providers of one `with` is the same label; listing it twice
    # provides nothing more. With no tag to take away, the set variable is replaced by one that
    # excludes nothing.
    'body/effects\.rs:\d+:\d+: replace == with != in BodyInfer<.*>::with_effects',
    'body/effects\.rs:\d+:\d+: replace match guard !tags\.is_empty\(\) with true in BodyInfer<.*>::subtract',
    # A union or braces written as a type argument are lowered as a set whatever the parameter is
    # marked, so marking the parameters inside them changes no type or diagnostic (checked by
    # disabling these arms against the tests and the core sources).
    'src/lower\.rs:\d+:\d+: delete match arm TypeKind::(ErrorSet|EffectSet)\(set\) in mark_set_arg',
    # Only a syntax error leaves a type argument missing; a written path with arguments that is
    # not an effect is reported as a type in either branch.
    'src/lower\.rs:\d+:\d+: delete match arm \(TypeKind::Missing, _\) in TyTable::lower_set_arg',
    'src/lower\.rs:\d+:\d+: replace match guard args\.is_empty\(\) \|\| .* with true in TyTable::lower_set_arg',
    # A layer has no init parameters either, so taking it for a handler leads to the same
    # diagnostic.
    'body\.rs:\d+:\d+: replace match guard matches!\(program\.item\(def\), Some\(Item::Handler\(_\)\)\) with true in BodyInfer<.*>::infer_supply_args',
    # The signature of an impl fn is read only for `main` and test functions, which are not impl
    # fns.
    'body\.rs:\d+:\d+: delete match arm (Res::Def\(t\)|Some\(Item::TraitFn\(item\)\)) in fn_parts',
    # A trait fn without a body has nothing to infer, and one without a signature has an error in
    # its declaration; handlers get their types from declarations, so inferring them before the
    # fns that name them through a layer changes nothing.
    'check\.rs:\d+:\d+: replace && with \|\| in groups',
    'check\.rs:\d+:\d+: delete match arm Some\(Item::Layer\(_\)\) in groups',
    # Functions of different arities fail to join in either branch, with the same error.
    'infer\.rs:\d+:\d+: replace match guard f\.params\.len\(\) == g\.params\.len\(\) with true in InferCtx::join',
    # A type parameter with type arguments is not written.
    'src/lower\.rs:\d+:\d+: replace match guard args\.is_empty\(\) with true in mark_set_arg',
    # The fn made by `@entry` is one call of the adapter, where no warning arises.
    'diagnostic\.rs:\d+:\d+: replace DiagnosticKind::is_warning -> bool with false',
    # `use Async` is E0414 and has the error type, so it adds no tag either way.
    'body/effects\.rs:\d+:\d+: replace match guard program\.prelude_def\("Async"\) == Some\(\*effect\) with false in BodyInfer<.*>::expr_effects',
    # A method's fn takes the receiver, so it has a first parameter.
    'body/methods\.rs:\d+:\d+: replace match guard !f\.params\.is_empty\(\) with true in BodyInfer<.*>::infer_method_call',
    # Wildcards and bindings also fall to the last arm, which makes a wildcard.
    'coverage\.rs:\d+:\d+: delete match arm \(PatKind::Wild \| PatKind::Bind\(_\) \| PatKind::Missing, _\) in Shapes<.*>::pat',
    # A definition without an item that is not a trait fn has no name the Prelude's trait fns
    # have, so it gets no signature either way.
    'signature\.rs:\d+:\d+: replace match guard program\.defs\[def\]\.kind == DefKind::TraitFn with true in Signatures::collect',
    # The call on the right of `|>` is visited as an expression of its own, with the same result.
    'body/suspend\.rs:\d+:\d+: replace match guard !matches!\(program\.exprs\[\*rhs\]\.kind, ExprKind::Call \{ \.\. \}\) with true in BodyInfer<.*>::check_fn_op_bodies',
    'body/suspend\.rs:\d+:\d+: delete match arm ExprKind::Call\{callee, args\} in Walker<.*>::expr',
    # The functions of Std.Fiber that take a function name the built-in effect first in its uses.
    'fiber\.rs:\d+:\d+: replace match guard effects\.contains\(&d\) with true in names_effect',
    # The call on the right of `|>` is also found as the origin through its own E.
    'body/errors\.rs:\d+:\d+: delete match arm ExprKind::Call\{callee, args\} in BodyInfer<.*>::expr_row',
    # A type parameter is never the head of the receiver's type, so taking it as one finds the
    # same fns.
    'body/methods\.rs:\d+:\d+: replace match guard program\.defs\[d\]\.kind != DefKind::TypeParam with true in written_first_param',
    # A set variable in a named type's argument of an inferred type comes with a function type
    # that holds it, which the function arm collects; a const has no set parameters, so no
    # parameters and none to name are the same.
    'body/errors\.rs:\d+:\d+: (replace match guard !positive with (true|false)|delete !) in BodyInfer<.*>::negative_row_vars',
    'body/errors\.rs:\d+:\d+: (delete match arm Some\(Item::Const\(item\)\)|replace == with !=) in BodyInfer<.*>::current_params',
    # emela-core.
    # The positions are a permutation of 0..n, so no two neighbors are equal.
    'emela-core/src/named\.rs:\d+:\d+: replace < with <= in in_written_order',
    # A type table starts with the built-in types, so it is never empty.
    'emela-core/src/ir\.rs:\d+:\d+: replace TypeTable::is_empty -> bool with false',
    # Substituting into a type without type parameters rebuilds the same type, which interning
    # gives the same ID (a function type has `sets` only while they hold set type parameters).
    'emela-core/src/ir\.rs:\d+:\d+: replace TypeStore::may_change -> bool with true',
    # A set type parameter bounded by Immediate is only instantiated with sets that do not
    # suspend, so keeping its bit among the candidates never sets it in a copy.
    'emela-core/src/lower/suspend\.rs:\d+:\d+: (replace == with != in effect_params|replace < with (==|>|<=) in effect_params|replace &= with \|= in effect_params|delete ! in effect_params|replace << with >> in effect_params)',
    # No function has 64 type parameters.
    'emela-core/src/lower/suspend\.rs:\d+:\d+: replace < with <= in (spec_has|collect_effect_params)',
    # A constant hash keeps every map correct, only slower.
    'emela-core/src/lower\.rs:\d+:\d+: replace <impl std::hash::Hash for EffectKey>::hash with \(\)',
    # The Prelude's Eq.eq, Ord.compare and Show.show are each the first fn of their trait, so
    # finding a fn of the trait or one of the name gives the same one.
    'emela-core/src/lower\.rs:\d+:\d+: replace && with \|\| in Lowerer<.*>::prelude_trait_fn',
    # No other effect is declared in the module of Std.State.
    'emela-core/src/lower\.rs:\d+:\d+: replace && with \|\| in Lowerer<.*>::state_run',
    # The type checker records the type arguments and sets of every reference, also within a
    # group being inferred, so the fallbacks for an unrecorded reference are not reached (no
    # workspace test reaches them; checked by making them print), and a self reference with
    # recorded arguments has the function's own parameters as them.
    'emela-core/src/lower\.rs:\d+:\d+: (replace && with \|\||replace >= with <|replace < with (<=|==|>)|replace == with !=|replace & with (\^|\|)|replace != with ==|delete field suspends from struct SetSummary expression) in Lowerer<.*>::ty_args',
    'emela-core/src/lower\.rs:\d+:\d+: replace == with != in Lowerer<.*>::key_ty',
    # A capability type is only ever the type of a capability value itself: one cannot be
    # passed (E0408), stored in data (E0409) or returned (E0410), and an effect is not a type
    # (E0221). So no other type holds one, and asking whether it may change only does extra work.
    'emela-core/src/mono\.rs:\d+:\d+: (replace Mono<.*>::has_handler -> bool with true|replace \+ with \* in Mono<.*>::has_handler|delete match arm .* in Mono<.*>::has_handler|replace \|\| with && in Mono<.*>::has_handler)',
    'emela-core/src/mono\.rs:\d+:\d+: replace <impl TypeStore for Subst<.*>>::may_change -> bool with true',
    # The output's type table starts as the old module's and the typer's extends it the same way,
    # so importing an old type gives the same ID.
    'emela-core/src/mono\.rs:\d+:\d+: replace < with > in Mono<.*>::import',
    # `fail` takes only an error (or a type parameter, replaced by one), and deciding the
    # display of an error twice gives the same.
    'emela-core/src/mono\.rs:\d+:\d+: replace \|\| with && in Mono<.*>::error_display',
    # Lowering passes an evidence table built with `provide` only as the last argument of a
    # call to a generic function (`generic_ev`).
    'emela-core/src/mono\.rs:\d+:\d+: (replace match guard is_ev && !ty_args.is_empty\(\) with true|replace && with \|\|) in Mono<.*>::call',
    # Derive generates every impl now, so no call reaches a type without one, and checking the
    # list of missing impls for a duplicate is never reached.
    # (The `!` at column 20 is the one of `!self.missing_impls.contains`.)
    'emela-core/src/mono\.rs:\d+:20: delete ! in Mono<.*>::target',
    # A set variable is left in a body only in a const generalized over it, which has no
    # suspending copies (its copy is always 0), so which variable it is does not matter.
    'emela-core/src/lower/suspend\.rs:\d+:\d+: replace == with != in Lowerer<.*>::row_suspends',
    # As in `ty_args`, a reference without recorded sets is only a self reference, so the branch
    # for a reference within a group is not reached (checked by making it print).
    'emela-core/src/lower/suspend\.rs:\d+:\d+: (replace match guard self\.current_def == Some\(def\) with true|replace && with \|\||replace \|= with &=|replace << with >>) in Lowerer<.*>::specialization_of',
    # emela-lir.
    # A release's body is a call of the handler's release function (`X$release`), so whether it
    # may suspend is the call's mark; the other cases are never reached.
    'emela-lir/src/from_core\.rs:\d+:\d+: (delete match arm Expr::Lambda\{\.\.\}|replace match guard op\.suspends\(\) with (true|false)|replace \|\| with &&) in may_suspend',
    # A value of a type without representation has no operand to coerce, and equal types erase
    # to the same.
    'emela-lir/src/from_core\.rs:\d+:\d+: replace \|\| with && in Lower<.*>::differs',
    # The general path of `with` binds a bind without a release as the plain one does.
    'emela-lir/src/from_core\.rs:\d+:\d+: replace match guard binds\.iter\(\)\.all\(\|b\| b\.release\.is_none\(\)\) with false in Lower<.*>::expr',
    # An operation without type parameters of its own has no `Any` parameter to box for.
    'emela-lir/src/from_core\.rs:\d+:\d+: replace > with >= in Lower<.*>::call',
    # Monomorphization replaces String.show_nested; the arm only says so.
    'emela-lir/src/from_core\.rs:\d+:\d+: delete match arm Builtin::ShowNested in Lower<.*>::builtin',
    # What follows a value of type Never is unreachable, so its type is never looked at.
    'emela-lir/src/from_core\.rs:\d+:\d+: delete match arm Type::Never in Lower<.*>::fiber_result',
    # A list pattern with a rest needs an element before it, so it is never irrefutable.
    'emela-lir/src/from_core\.rs:\d+:\d+: replace && with \|\| in irrefutable',
    # An enum without constructors (an external type) has no Eq.
    'emela-lir/src/from_core/derive\.rs:\d+:\d+: delete match arm 0 in Lower<.*>::eq_body',
    # The Core verifier rejects an escape arm `_` with a guard.
    'emela-lir/src/from_core/pat\.rs:\d+:\d+: replace match guard arm\.guard\.is_none\(\) with true in Lower<.*>::escape',
    # The defects are analysed after closures are lifted and before failure landings are made,
    # so no closure or `Handle` body is met; a direct call goes to the callees instead; and the
    # only runtime operations that may raise a defect, the fairness yields, are in suspending
    # functions, which raise one anyway.
    'emela-lir/src/heap/defects\.rs:\d+:\d+: delete match arm Value::(Closure\(c\)|Call\{on_fail:Some.*) in visit',
    'emela-lir/src/heap/defects\.rs:\d+:\d+: delete match arm Value::(Call\{callee:Callee::Direct\(_\), \.\.\}|Runtime\{op, \.\.\}) in may_defect_without_flags',
    # A loop comes from a self tail call and takes every live variable as a loop variable, so
    # nothing outside its arguments is live at `recur`.
    'emela-lir/src/heap/(live|rc)\.rs:\d+:\d+: delete match arm Term::Recur\(_\) in .*',
]
