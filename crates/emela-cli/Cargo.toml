[package]
name = "emela-cli"
description = "The emela binary: argument parsing, running run and test, and emela pome"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
emela-driver.workspace = true
emela-lsp.workspace = true
emela-pome = { workspace = true, features = ["net"] }
clap.workspace = true

[[bin]]
name = "emela"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
serde_json.workspace = true

[[test]]
name = "tests"
path = "tests/main.rs"
