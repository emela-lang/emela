[package]
name = "emela-driver"
description = "The pipeline, diagnostic collection and rendering, and build configuration (Pome.toml)"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
emela-syntax.workspace = true
emela-fmt.workspace = true
emela-resolve.workspace = true
emela-types.workspace = true
emela-core.workspace = true
emela-lir.workspace = true
emela-codegen-js.workspace = true
emela-codegen-c.workspace = true
emela-codegen-wasm.workspace = true
la-arena.workspace = true
smol_str.workspace = true
line-index.workspace = true
ariadne.workspace = true
serde.workspace = true
toml.workspace = true
emela-pome.workspace = true
# `preserve_order`: `emela doctor --format json` writes its keys in the order of `[cmd.doctor]`.
serde_json = { workspace = true, features = ["preserve_order"] }
pulldown-cmark.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
libtest-mimic.workspace = true
# The differential harness builds an `Input`, which wants a `Fetcher`; `Http` is behind `net`,
# which the workspace dependency leaves off for the targets without sockets.
emela-pome = { workspace = true, features = ["net"] }

[[test]]
name = "parity"
harness = false

[[test]]
name = "wasm_corpus"
harness = false

[[test]]
name = "wasm_parity"
harness = false

[[test]]
name = "tests"
path = "tests/main.rs"
