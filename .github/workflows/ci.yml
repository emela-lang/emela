name: CI

# The merge gate: runs on every pull request and on pushes to the long-lived
# branches. Branch protection on `dev` and `main` should require these checks.

on:
  pull_request:
  push:
    branches: [main, dev, next]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # `emela run` and the JS backend tests execute the generated code with node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The WASM backend tests execute the generated modules with wasmtime.
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test
        run: cargo test --workspace --locked

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `emela run` and `emela test` execute the generated JS with node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: cargo build --bin emela --locked
      - name: Check, test and fmt every example
        run: |
          emela="$PWD/target/debug/emela"
          for dir in examples/*/; do
            echo "::group::$dir"
            (cd "$dir" && "$emela" check && "$emela" test && "$emela" fmt --check)
            echo "::endgroup::"
          done
