name: CI

# The merge gate: runs on every pull request and on each group of the merge
# queue. Branch protection requires `ci-ok` alone, which sums up the other jobs.
#
# A push to main runs too, but only builds: the merge queue already tested the
# same commit. It is the one run that saves the Rust caches (`save-if`), since
# a cache saved on another ref is read only by that ref, while every ref reads
# the caches of main. Saving them anywhere else only fills the 10 GB the
# repository has for caches and pushes main's out.
#
# The jobs themselves are in the reusable workflows `ci-*.yml`; this file only
# decides which of them a change needs and sums them up. `needs` cannot reach
# across workflows, so they are called from here rather than triggered alone.
#
# A pull request runs the tests on Linux only; the merge queue runs them on
# macOS too, and builds and runs the examples on Windows, so main is checked on
# all three before a change lands. Changes that touch only documentation skip
# everything but `ci-ok`.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      spec: ${{ steps.filter.outputs.spec }}
      grammar: ${{ steps.filter.outputs.grammar }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Look for changes beyond the documentation
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: scripts/ci/changes.sh

  # The compiler's Rust code: lint and the test suite.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci-rust.yml

  # Emela programs run by the compiler: the examples, the laws, the playground, Windows.
  emela:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci-emela.yml

  # The specification and the adoption of proposals.
  spec:
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    uses: ./.github/workflows/ci-spec.yml
    permissions:
      contents: read
      pull-requests: read

  # Not part of `ci-ok`: the grammar is an editor aid, so a change to the syntax is not held back
  # until the grammar follows it. A failure here shows the drift on the pull request.
  grammar:
    needs: changes
    if: needs.changes.outputs.grammar == 'true'
    uses: ./.github/workflows/ci-grammar.yml

  # The one check branch protection requires. A skipped job (documentation only)
  # counts as passed; a failed or cancelled one does not.
  ci-ok:
    if: always()
    needs: [changes, rust, emela, spec]
    runs-on: ubuntu-latest
    steps:
      - name: Sum up the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
