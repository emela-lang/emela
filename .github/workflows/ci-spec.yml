name: CI / Spec

# The specification and the adoption of proposals. Called from ci.yml.

on:
  workflow_call:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check section names and proposals
        run: python3 scripts/spec.py check

  # A pull request that adds a proposal changes spec/ and waits for the author's `/accept`
  # (scripts/ci/proposal-adopted.sh). The `Proposal decision` workflow runs the job again after
  # `/accept`. The merge queue skips it: a pull request enters the queue only after it passed here,
  # and leaves the queue when a commit is pushed.
  proposal-adopted:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Require the author's /accept for a proposal being added
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOT: emela-bot[bot]
        run: scripts/ci/proposal-adopted.sh
