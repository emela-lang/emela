name: Proposal decision

# The language's author decides a proposal with a comment on its pull request (label `proposal`):
#
#   /accept               /reject
#   <the reasons>         <the reasons>
#
# `/accept` checks the proposal as the head commit has it (`scripts/spec.py ready` and `check`),
# comments a marker with that commit, which the `proposal-adopted` job of CI requires, runs that job
# again, marks the pull request ready for review, and adds it to the merge queue. `/reject` closes
# the pull request with the reasons. Neither pushes to the pull request's branch, so a pull request
# from a fork is decided the same way. After the pull request is closed, the `Proposal record`
# workflow records the decision in the repository. Comments from anyone else are ignored
# (proposals/README.md, "Decision").

on:
  issue_comment:
    types: [created]

concurrency:
  group: proposal-decision-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  decide:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'proposal') &&
      github.event.comment.user.login == 'Allianaab2m' &&
      (startsWith(github.event.comment.body, '/accept') || startsWith(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only runs CI again; everything else goes through the App token.
    permissions:
      actions: write
    steps:
      - name: "Mint token (GitHub App: emela-bot)"
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: emela-lang
          repositories: emela

      - name: Read the command
        id: command
        env:
          BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          first="$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r' | xargs)"
          case "$first" in
            /accept|/reject) ;;
            *) echo "not a command: $first"; echo "verb=" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "verb=${first#/}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$BODY" | tail -n +2 | tr -d '\r' > "$RUNNER_TEMP/reasons.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/reasons.md"; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused > /dev/null
            echo "::error::write the reasons on the lines after $first"
            exit 1
          fi
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null

      - name: Reject
        if: steps.command.outputs.verb == 'reject'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          {
            echo "Rejected by the language's author."
            echo
            cat "$RUNNER_TEMP/reasons.md"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh pr close "$PR" --repo "$REPO"

      - name: Find the proposal and the head commit
        id: pr
        if: steps.command.outputs.verb == 'accept'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          echo "sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | "\(.status) \(.filename)"' > "$RUNNER_TEMP/files"
          added="$(sed -n 's/^added \(proposals\/[^/]*\.md\)$/\1/p' "$RUNNER_TEMP/files" \
            | grep -vE '^proposals/(README|TEMPLATE)\.md$' || true)"
          if [ "$(printf '%s' "$added" | grep -c .)" != 1 ]; then
            echo "::error::expected exactly one new proposal in the pull request, found: ${added:-none}"
            exit 1
          fi
          if ! cut -d' ' -f2- "$RUNNER_TEMP/files" | grep '^spec/' | grep -qvx 'spec/history.md'; then
            echo "::error::the pull request does not change spec/; the proposal's change to the specification goes in the same pull request"
            exit 1
          fi
          echo "slug=$(basename "$added" .md)" >> "$GITHUB_OUTPUT"

      # The head commit is read as data. The code that runs is scripts/spec.py of the default
      # branch: a pull request must not choose the code the bot runs.
      - name: Checkout the head commit
        if: steps.command.outputs.verb == 'accept'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Checkout scripts/spec.py of the default branch
        if: steps.command.outputs.verb == 'accept'
        uses: actions/checkout@v7
        with:
          path: base
          sparse-checkout: scripts/spec.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the proposal
        if: steps.command.outputs.verb == 'accept'
        env:
          SLUG: ${{ steps.pr.outputs.slug }}
        run: |
          cp base/scripts/spec.py scripts/spec.py
          rm -rf base
          python3 scripts/spec.py ready "$SLUG"
          python3 scripts/spec.py check

      - name: Accept the head commit
        if: steps.command.outputs.verb == 'accept'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          SLUG: ${{ steps.pr.outputs.slug }}
        run: |
          {
            echo "<!-- proposal-accepted: $SHA -->"
            echo "Accepted \`proposals/$SLUG.md\` at $SHA. The pull request is added to the merge queue; after it is merged, the adoption is recorded in a pull request of its own."
            echo
            echo "A commit pushed after this one needs a new \`/accept\`."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh pr ready "$PR" --repo "$REPO" || true

      # The `proposal-adopted` job failed before the marker existed. Wait for the run of the head
      # commit to finish, then run its failed jobs again so that `ci-ok` can pass.
      - name: Run CI again
        if: steps.command.outputs.verb == 'accept'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          run="$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --event pull_request \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run" ]; then
            echo "::warning::no CI run for $SHA (a run from a fork may be waiting for approval)"
            exit 0
          fi
          for _ in $(seq 120); do
            [ "$(gh run view "$run" --repo "$REPO" --json status --jq .status)" = completed ] && break
            sleep 15
          done
          if [ "$(gh run view "$run" --repo "$REPO" --json conclusion --jq .conclusion)" != success ]; then
            gh run rerun "$run" --repo "$REPO" --failed
          fi

      - name: Add to the merge queue
        if: steps.command.outputs.verb == 'accept'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.event.issue.number }}
          HEAD_OID: ${{ steps.pr.outputs.sha }}
        run: |
          # Wait for the required checks, then add the pull request to the merge queue with the
          # `enqueuePullRequest` mutation ("Merge when ready"). `gh pr merge` cannot be used: on a
          # branch that requires the merge queue it always enables auto-merge, which the repository
          # does not allow. `expectedHeadOid` makes the queue refuse a commit pushed after HEAD_OID.
          sleep 20
          for _ in $(seq 120); do
            buckets="$(gh pr checks "$TARGET" --repo "$REPO" --required --json bucket \
              --jq '[.[].bucket] | unique | join(" ")' 2>/dev/null || true)"
            case " $buckets " in
              *" fail "* | *" cancel "*) echo "::error::a required check failed: $buckets"; exit 1 ;;
              "  " | *" pending "*) ;;
              *)
                id="$(gh pr view "$TARGET" --repo "$REPO" --json id --jq .id)"
                # shellcheck disable=SC2016 # GraphQL variables, not shell ones
                gh api graphql -f id="$id" -f oid="$HEAD_OID" -f query='
                  mutation($id: ID!, $oid: GitObjectID!) {
                    enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $oid}) {
                      mergeQueueEntry { state }
                    }
                  }'
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::error::the required checks did not finish in 30 minutes"
          exit 1

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "The command failed. See $RUN"
