name: CI / Build

# Builds the compiler and its tests for Linux once, for every job of ci-rust.yml and ci-emela.yml
# that runs them. Called from ci.yml.
#
# The tests are packed with `cargo nextest archive`: the test binaries, the `emela` binary that
# the tests of emela-cli start, and what the build scripts produced. The test jobs unpack it and
# run their share without building anything. The tests embed the paths of the workspace at build
# time (`CARGO_MANIFEST_DIR`, `CARGO_BIN_EXE_emela`); every Linux runner checks the repository
# out at the same path, so these paths hold on the runner that runs them.
#
# A push to main builds the same thing without uploading it, to refill the cache: the merge queue
# already tested the same commit. Only main saves the cache.

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    # Line tables are enough for the backtraces, and keep the archive small. Set on the job, not
    # the step, so that rust-cache keys the cache on it.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the tests
        run: cargo nextest archive --workspace --locked --archive-file tests.tar.zst
      # The archive is already compressed with zstd; compressing it again only costs time.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: tests-linux
          path: tests.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: emela-linux
          path: target/debug/emela
          retention-days: 1
