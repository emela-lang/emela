name: CI / Rust

# The compiler's Rust code: formatting, clippy and the test suite. Called from ci.yml.
#
# A push to main builds what the jobs would test without running it, to refill the caches
# (ci.yml). Only main saves them.

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unicode tables
        run: python3 scripts/gen-unicode-tables.py --check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        # The tests are bound by CPU, not by how they are scheduled on one runner:
        # on Linux they are split over three runners, each building the tests itself.
        # A push only builds them, which one runner does.
        shard: ${{ fromJSON(github.event_name == 'push' && '[1]' || '[1, 2, 3]') }}
        # macOS runs them on one runner. The organization has few macOS runners, and the merge
        # queue builds several groups at once: three shards per group kept jobs waiting for a
        # runner far longer than the tests take.
        exclude:
          - os: macos-latest
            shard: 2
          - os: macos-latest
            shard: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Line tables are enough for the backtraces, and build faster. Set on the
    # job, not the step, so that rust-cache keys the cache on it.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      SHARDS: ${{ matrix.os == 'macos-latest' && 1 || 3 }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `emela run` and the JS backend tests execute the generated code with node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The WASM backend tests execute the generated WASI 0.3 components with
      # wasmtime. p3 support needs 49 or newer.
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 49.0.3
      # nextest splits the tests over the shards. It does not run doctests, and
      # the workspace has none: add `cargo test --doc` when one appears.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test
        if: github.event_name != 'push'
        run: cargo nextest run --workspace --locked --profile ci --partition "count:${{ matrix.shard }}/$SHARDS"
      - name: Build the tests
        if: github.event_name == 'push'
        run: cargo nextest run --workspace --locked --profile ci --no-run

  # The JS tests of the compiler (`emela run` and `emela test` in `crates/emela-driver` and
  # `crates/emela-cli`, and the JS side of the WASM tests) on Bun, the other JS host that
  # `[target]` supports. The other jobs run them on Node. The examples and the laws on Bun are in
  # ci-emela.yml.
  test-bun:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      EMELA_JS_HOST: bun
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # Some tests start node themselves (the JS backend's own tests and the HTTP harness).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 49.0.3
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test on Bun
        if: github.event_name != 'push'
        run: cargo nextest run -p emela-driver -p emela-cli -p emela-codegen-wasm --locked --profile ci
      - name: Build the tests
        if: github.event_name == 'push'
        run: cargo nextest run -p emela-driver -p emela-cli -p emela-codegen-wasm --locked --profile ci --no-run
