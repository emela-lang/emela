name: CI / Rust

# The compiler's Rust code: formatting, clippy and the test suite. Called from ci.yml.
#
# On Linux the tests run from the archive that ci-build.yml builds. A push to main runs the lint
# and builds the tests on macOS without running them, to refill the caches (ci.yml). Only main
# saves them.

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unicode tables
        run: python3 scripts/gen-unicode-tables.py --check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Every test on Node, and the JS tests of the compiler on Bun, the other JS host that `[target]`
  # supports: `emela run` and `emela test` in `crates/emela-driver` and `crates/emela-cli`, and the
  # JS side of the WASM tests. The examples and the laws on Bun are in ci-emela.yml.
  #
  # The tests are bound by CPU. They are built once (ci-build.yml) and split over four runners;
  # each runs its share on Node, then its share of the Bun tests. Running both hosts on the same
  # runners, rather than a runner per host, halves the jobs a pull request waits for.
  test:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARTITION: count:${{ matrix.shard }}/4
      # A pull request compiles the C the tests generate without optimization: cc at -O2 took
      # about half the CPU time of the tests. The merge queue keeps the -O2 of a native build, so a
      # fault that only optimization brings out still stops a change before it lands.
      EMELA_CC_ARGS: ${{ github.event_name == 'pull_request' && '-O0' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: tests-linux
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # `emela run` and the JS backend tests execute the generated code with node. On Bun some
      # tests still start node themselves (the JS backend's own tests and the HTTP harness).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The WASM backend tests execute the generated WASI 0.3 components with
      # wasmtime. p3 support needs 49 or newer.
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 49.0.3
      # nextest splits the tests over the shards. It does not run doctests, and
      # the workspace has none: add `cargo test --doc` when one appears.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Unpack into the checkout, where the tests were built: they start `target/debug/emela` by
      # the path built into them. The run on Bun unpacks over the first.
      - name: Test on Node
        run: >-
          cargo nextest run --archive-file tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite
          --profile ci --partition "$PARTITION"
      - name: Test on Bun
        if: ${{ !cancelled() }}
        env:
          EMELA_JS_HOST: bun
        run: >-
          cargo nextest run --archive-file tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite
          --profile ci --partition "$PARTITION"
          -E 'package(emela-driver) | package(emela-cli) | package(emela-codegen-wasm)'

  # Every test on macOS, on Node. The organization has few macOS runners, and the merge queue builds
  # several groups at once, so one runner builds the tests and runs them all. A pull request skips
  # it; a push to main only builds, to refill the cache.
  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    # Line tables are enough for the backtraces, and build faster. Set on the
    # job, not the step, so that rust-cache keys the cache on it.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # As in ci-build.yml: the compiler under test runs a third as long at opt-level 1.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 49.0.3
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test
        if: github.event_name != 'push'
        run: cargo nextest run --workspace --locked --profile ci
      - name: Build the tests
        if: github.event_name == 'push'
        run: cargo nextest run --workspace --locked --profile ci --no-run
