name: Prerelease
# Hand-cut prereleases (e.g. `v0.20.0-alpha.1`) from any branch, typically
# `next`. Stable `vX.Y.Z` releases stay with release-plz.yml on `main`; the
# `v*-*` filter (a hyphen is required) keeps the two from overlapping.
#
# A tag push runs the workflow definition at the tagged commit, so this works
# before the file reaches `main`. `workflow_dispatch` only works once the file
# is on the default branch; it is kept as a fallback to re-run a tag.
on:
  push:
    tags:
      - "v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Prerelease tag to build (e.g. v0.20.0-alpha.1). The tag must already exist."
        required: true
        type: string

concurrency:
  group: prerelease-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'emela-lang' }}
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve and validate the tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v*-*) ;;
            *)
              echo "::error::'$TAG' is not a prerelease tag (expected vX.Y.Z-<pre>, e.g. v0.20.0-alpha.1)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Git Bash on Windows, so the same steps run on every runner.
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Fail fast before the release build if the tag and Cargo.toml disagree.
      - name: Check the tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "emela-cli") | .version')
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::tag $TAG does not match emela-cli version $version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin emela

      - name: Check the binary reports the tag's version
        run: |
          reported=$(target/${{ matrix.target }}/release/emela --version)
          if [ "${reported%%+*}" != "emela ${TAG#v}" ]; then
            echo "::error::emela --version printed '$reported', expected 'emela ${TAG#v}' (with an optional +<hash>)"
            exit 1
          fi

      # Same naming as release-plz.yml: a tarball on Linux and macOS, which install.sh fetches as
      # emela-<tag>-<target>.tar.gz, and a zip with `emela.exe` on Windows.
      - name: Package
        run: |
          name="emela-$TAG-${{ matrix.target }}"
          mkdir -p package
          cp LICENSE package/
          cp crates/emela-codegen-wasm/data/unicode/17.0.0/LICENSE.txt package/LICENSE-UNICODE
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/emela.exe package/
            (cd package && 7z a -tzip "../$name.zip" emela.exe LICENSE LICENSE-UNICODE)
          else
            cp target/${{ matrix.target }}/release/emela package/
            tar czf "$name.tar.gz" -C package emela LICENSE LICENSE-UNICODE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emela-${{ matrix.target }}
          path: |
            emela-*.tar.gz
            emela-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: emela-*
          merge-multiple: true

      # Re-running on an existing release (e.g. via workflow_dispatch) replaces
      # the assets instead of failing on the create.
      - name: Create prerelease and upload tarballs
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ./emela-*.tar.gz ./emela-*.zip --clobber
          else
            gh release create "$TAG" ./emela-*.tar.gz ./emela-*.zip \
              --prerelease --verify-tag --generate-notes --title "$TAG"
          fi
